name: Daily Swingtrade Load

on:
  schedule:
    # 1:00 AM UTC every day
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  load-swingtrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run loadswing.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python loadswing.py
